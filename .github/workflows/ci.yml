name: CI

on:
  push:
    branches: [main, plugin]
  pull_request:

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Run JVM tests
        run: ./gradlew jvmTest
